[package]
name = "titandns"
version = "1.0.3"
edition = "2021"
authors = ["TitanDNS Team"]
description = "A next-generation, high-performance DNS forwarder powered by Rust and eBPF"

[features]
default = ["jemalloc"]
jemalloc = []

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# DNS Protocol & Server
hickory-server = { version = "0.25.0-alpha.4", default-features = false }
hickory-proto = "0.25.0-alpha.4"
hickory-resolver = { version = "0.25.0-alpha.4", features = ["dns-over-rustls"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.13"
futures = "0.3"
bytes = "1.5"  # Zero-copy buffer for performance
async-channel = "2.1"  # MPMC channel for Worker Pool

# CLI Argument Parsing
clap = { version = "4.4", features = ["derive"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"  # Log rotation support

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Caching
moka = { version = "0.12", features = ["future"] }
dashmap = "5.5"  # Lock-free concurrent HashMap for LazyCache

# Async Utilities
async-trait = "0.1"
singleflight = "0.3"

# IP Handling
ipnet = "2.9"
maxminddb = "0.23"
libc = "0.2"

# Rules & Filter
core_affinity = "0.8"  # 绑核支持
lazy_static = "1.4"    # Global static instances

# Crypto & Time
md5 = "0.7"
sha2 = "0.10"   # For AliAPI SHA256 signature
hex = "0.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }

# HTTP Client (for DoH upstreams & AliAPI)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "http2"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
hyper = { version = "1.8", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }

# TLS Support (0.23 Stack)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
quinn = { version = "0.11", features = ["rustls"] }
tokio-rustls = "0.26"

# Memory Allocator (High Performance - Linux/MacOS only)
rustls-pemfile = "2.1"
webpki-roots = "0.25"
rustls-native-certs = "0.7"
prost = "0.12"
url = "2.5"
socket2 = { version = "0.5", features = ["all"] }
radix_trie = "0.2"
regex = "1.10"
rand = "0.8"
# Config Hot Reload
notify = "6.1"
arc-swap = "1.7" # Atomic pointer swapping for Lock-Free Hot Reload 2.0

# Rust Performance Optimizations
phf = { version = "0.11", features = ["macros"] }  # Compile-time perfect hashing
bumpalo = "3.14"  # Arena allocator
crossbeam = "0.8"  # Lock-free data structures

# Metrics (Prometheus)
prometheus = "0.13"
once_cell = "1.19"
parking_lot = "0.12.5"
num_cpus = "1.16"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = "0.5"

[dev-dependencies]
tempfile = "3.8"

# eBPF Support (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"

# --- ULTIMATE OPTIMIZATIONS FOR RELEASE ---
[profile.release]
opt-level = 3           # Max optimization
lto = "fat"             # Link Time Optimization (smaller & faster)
codegen-units = 1       # Reduce parallelism for better code generation
panic = "abort"         # Remove unwind tables (smaller binary)
strip = true            # Strip symbols (smaller binary)
