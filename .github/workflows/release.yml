name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: ""
          - os: ubuntu-latest
            arch: x86_64-v3
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
          - os: ubuntu-latest
            arch: arm64
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            rustflags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install eBPF toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          DATE=$(date +%Y%m%d)
          rm -rf dist
          mkdir -p dist/bin dist/bpf dist/rules
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/titandns.exe dist/bin/titandns.exe
          else
            cp target/${{ matrix.target }}/release/titandns dist/bin/titandns
          fi
          cp -R www dist/www
          cp bpf/titan_filter.c dist/bpf/
          if [ "$RUNNER_OS" = "Linux" ] && { [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "x86_64-v3" ]; }; then
            clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I/usr/include -I/usr/include/x86_64-linux-gnu \
              -c bpf/titan_filter.c -o dist/bpf/titan_dns_filter.o || echo "eBPF compile failed"
          else
            echo "Skip eBPF prebuild for ${RUNNER_OS}-${{ matrix.arch }} (will compile on target if needed)"
          fi
          cp install_pkg.sh dist/install.sh
          cp update_rules.sh dist/update_rules.sh
          cp health_check.sh dist/health_check.sh
          cp config.example.yaml dist/config.yaml
          cp -R rules/* dist/rules/ 2>/dev/null || true
          chmod +x dist/install.sh dist/update_rules.sh dist/health_check.sh
          ARCHIVE="titandns-${VERSION}-${DATE}-${RUNNER_OS}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
