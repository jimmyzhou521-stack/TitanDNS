name: build

on:
  pull_request:
    branches: ["online"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: ""
          - os: ubuntu-latest
            arch: x86_64-v3
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
          - os: ubuntu-latest
            arch: arm64
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            rustflags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for Linux arm64
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          DATE=$(date +%Y%m%d)
          rm -rf dist
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/titandns.exe dist/
          else
            cp target/${{ matrix.target }}/release/titandns dist/
          fi
          cp -R www dist/www
          cp -R bpf dist/bpf
          ARCHIVE="titandns-${VERSION}-${DATE}-${RUNNER_OS}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
