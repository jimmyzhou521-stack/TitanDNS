# ============================================================================
# TitanDNS V1.0.2 Ultimate Edition - 生产级示例配置
# ============================================================================
# 
# 🚀 功能特性:
#   - 智能分流: 自动识别国内/国外域名，国内直连、国外走代理
#   - FakeIP 模式: 配合 sing-box 实现透明代理
#   - 双缓存架构: 国内/国外缓存严格分离，防止污染
#   - 高性能: XDP 内核加速，支持 500万+ QPS
#   - 全协议: UDP/TCP/DoH/DoT/DoQ/SOCKS5
#   - AliAPI: 阿里云 HTTPDNS 低延迟解析
#
# 📖 使用说明:
#   1. 复制此文件到 /etc/titandns/config.yaml
#   2. 根据实际环境修改配置（特别是网卡名称、sing-box 端口）
#   3. 运行 systemctl start titandns
#
# ⚠️  需要修改的配置项已用 ⚠️ 标记
#
# ============================================================================

# ==================== 全局设置 ====================
log:
  level: "info"
  file: "/var/log/titandns/titandns.log"

query_log:
  enabled: true
  max_size: 5000
  recent_blocked_limit: 500

singbox:
  auto_discover: true
  socks_port: 10000             # ⚠️ 与 sing-box socks 入站端口一致
  deadlock_domains: ["github.com", "raw.githubusercontent.com"]

api:
  http: "0.0.0.0:8080"

ebpf:
  interface: "eth0"             # ⚠️ 改成你的实际网卡名称
  bpf_path: "/etc/titandns/titan_dns_filter.o"
  blacklist: []
  xdp_cache:
    enabled: true
    max_entries: 100000
    sync_hot_queries: true

# ==================== 插件定义 ====================
plugins:
  # --- 广告拦截 ---
  adblock_main:
    type: "adblock"
    files:
      - "/etc/titandns/rules/adguard.txt"

  # --- DGA 恶意域名检测 ---
  dga_filter:
    type: "dga"
    entropy_threshold: 4.5
    min_len: 12
    dry_run: true

  # --- 双缓存架构 ---
  cache_domestic:
    type: "cache"
    size: 100000
    fakeip_protection: false
    recursive_mode: false
    prefetch_if_ttl_less_than: 240
    serve_stale_ttl: 120
    strategy: "race"
    timeout: 500
    upstreams:
      - addr: "udp://223.5.5.5:53"
        so_mark: 255
      - addr: "udp://119.29.29.29:53"
        so_mark: 255
      - addr: "udp://114.114.114.114:53"
        so_mark: 255
    persist_file: "/dev/shm/titandns/domestic.db"
    persist_interval: 300

  cache_proxy:
    type: "cache"
    size: 100000
    fakeip_protection: true
    recursive_mode: false
    prefetch_if_ttl_less_than: 240
    serve_stale_ttl: 120
    timeout: 2000
    upstreams:
      - addr: "udp://127.0.0.1:6666"  # ⚠️ sing-box DNS 入站端口
    persist_file: "/dev/shm/titandns/proxy.db"
    persist_interval: 300

  # --- 本地规则 ---
  hosts_custom:
    type: "hosts"
    file: "/etc/titandns/rules/hosts.txt"

  matcher_blocklist:
    type: "matcher"
    files:
      - "/etc/titandns/rules/blocklist.txt"
      - "/etc/titandns/rules/pcdnlist.txt"
  
  matcher_whitelist:
    type: "matcher"
    files:
      - "/etc/titandns/rules/whitelist.txt"
      - "/etc/titandns/rules/ddnslist.txt"
    mark: "direct"

  matcher_greylist:
    type: "matcher"
    files:
      - "/etc/titandns/rules/greylist.txt"
      - "/etc/titandns/rules/ai_proxy.txt"
    mark: "proxy"

  # --- IP 匹配器 ---
  ip_matcher_cn:
    type: "ip_matcher"
    files:
      - "/etc/titandns/rules/cn_ipv4.txt"
      - "/etc/titandns/rules/cn_ipv6.txt"
      - "/etc/titandns/rules/cn_ipv4_apnic.txt"
      - "/etc/titandns/rules/cn_ipv6_apnic.txt"
    mark: "ip_cn_accurate"

  # --- 阿里云 HTTPDNS（可选）---
  # 如需使用，取消注释并填入真实凭证
  # 文档: https://help.aliyun.com/document_detail/432223.html
  # aliapi_domestic:
  #   type: "aliapi"
  #   account_id: "YOUR_ACCOUNT_ID"
  #   access_key_id: "YOUR_ACCESS_KEY_ID"
  #   access_key_secret: "YOUR_ACCESS_KEY_SECRET"
  #   timeout_ms: 800

  # --- 上游 DNS ---
  ratelimit_global:
    type: "ratelimit"
    max_queries: 3000
    window_secs: 1

  upstream_local:
    type: "forward"
    strategy: "race"
    concurrent: 2048
    timeout: 300
    udp_reply_timeout_ms: 100
    udp_retries: 0
    tcp_connect_timeout_ms: 200
    tcp_read_timeout_ms: 400
    upstreams:
      - addr: "udp://223.5.5.5:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://119.29.29.29:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://114.114.114.114:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://180.76.76.76:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://140.207.198.6:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://211.136.112.50:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://180.184.1.1:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://218.30.118.6:53"
        so_mark: 255
        query_timeout_ms: 200
      - addr: "udp://1.2.4.8:53"
        so_mark: 255
        query_timeout_ms: 200

  # AliAPI Fallback（需先配置 aliapi_domestic）
  # fallback_local:
  #   type: "fallback"
  #   primary: "upstream_local"
  #   secondary: "aliapi_domestic"
  #   threshold: 50
  #   always_standby: false

  upstream_fakeip:
    type: "forward"
    strategy: "order"
    concurrent: 2048
    timeout: 300
    udp_reply_timeout_ms: 60
    udp_retries: 0
    tcp_connect_timeout_ms: 150
    tcp_read_timeout_ms: 300
    upstreams:
      - addr: "udp://127.0.0.1:6666"  # ⚠️ sing-box DNS 入站端口
        query_timeout_ms: 200

  upstream_doh:
    type: "forward"
    strategy: "smart"
    concurrent: 256
    timeout: 5000
    upstreams:
      - addr: "https://cloudflare-dns.com/dns-query"
        socks5: "127.0.0.1:10000"    # ⚠️ sing-box SOCKS5 端口
        query_timeout_ms: 800
      - addr: "https://dns.google/dns-query"
        socks5: "127.0.0.1:10000"
        query_timeout_ms: 800
      - addr: "https://doh.dns.sb/dns-query"
        socks5: "127.0.0.1:10000"
        query_timeout_ms: 800
      - addr: "https://dns.adguard-dns.com/dns-query"
        socks5: "127.0.0.1:10000"
        query_timeout_ms: 800

  upstream_doq:
    type: "forward"
    strategy: "race"
    concurrent: 256
    doq_idle_timeout: 120
    doq_socks5_timeout: 3
    upstreams:
      - addr: "quic://dns.adguard-dns.com:853"
        socks5: "127.0.0.1:10000"

  # --- 智能分流 ---
  smart_splitter:
    type: "smart_forward"
    geoip: "geoip_cn"
    ip_matcher: "ip_matcher_cn"
    local_timeout_ms: 250
    fakeip_timeout_ms: 700
    udp_reply_timeout_ms: 120
    udp_retries: 1
    tcp_connect_timeout_ms: 200
    tcp_read_timeout_ms: 400
    learning_cache_max_entries: 50000
    learning_cache_ttl_secs: 7200
    learning_cache_file: "/var/lib/titandns/learning_cache.json"
    avoid_fakeip_on_domestic: true
    prefer_local_on_miss: true
    domestic_suffixes:
      - ".cn"
      - ".cn."
    local:
      addr: "udp://223.5.5.5:53"
      so_mark: 255
    fakeip:
      addr: "udp://127.0.0.1:6666"

  # --- ECS ---
  ecs_cn:
    type: "ecs"
    auto: true
    # force_subnet: "YOUR_SUBNET/24"  # 可选：强制使用指定子网
    ipv4_netmask: 24
    ipv6_netmask: 56

  # --- GeoSite 规则 ---
  geosite_cn:
    type: "geosite"
    target: "cn"
    files:
      - "/etc/titandns/geosite.dat:cn"
      - "/etc/titandns/geosite.dat:tencent"
      - "/etc/titandns/geosite.dat:alibaba"
      - "/etc/titandns/geosite.dat:baidu"
      - "/etc/titandns/geosite.dat:bytedance"
      - "/etc/titandns/geosite.dat:bilibili"
      - "/etc/titandns/geosite.dat:netease"
      - "/etc/titandns/geosite.dat:jd"
      - "/etc/titandns/geosite.dat:xiaomi"
      - "/etc/titandns/geosite.dat:huawei"
      - "/etc/titandns/geosite.dat:360"
      - "/etc/titandns/geosite.dat:sina"
      - "/etc/titandns/geosite.dat:zhihu"
      - "/etc/titandns/geosite.dat:douban"
      - "/etc/titandns/geosite.dat:iqiyi"
      - "/etc/titandns/geosite.dat:youku"
      - "/etc/titandns/geosite.dat:mgtv"
      - "/etc/titandns/geosite.dat:douyu"
      - "/etc/titandns/geosite.dat:huya"
      - "/etc/titandns/geosite.dat:kugou"
      - "/etc/titandns/geosite.dat:kuwo"
      - "/etc/titandns/geosite.dat:pinduoduo"
      - "/etc/titandns/geosite.dat:meituan"
      - "/etc/titandns/geosite.dat:didi"
      - "/etc/titandns/geosite.dat:eleme"
      - "/etc/titandns/geosite.dat:steam"
      - "/etc/titandns/geosite.dat:mihoyo"
      - "/etc/titandns/geosite.dat:apple"
      - "/etc/titandns/geosite.dat:apple-cn"
      - "/etc/titandns/geosite.dat:microsoft"
      - "/etc/titandns/geosite.dat:microsoft-cn"
      - "/etc/titandns/geosite.dat:amazon-cn"
      - "/etc/titandns/geosite.dat:bank"
      - "/etc/titandns/geosite.dat:cmcc"
      - "/etc/titandns/geosite.dat:chinatelecom"
      - "/etc/titandns/geosite.dat:chinaunicom"
    mark: "cn"

  geosite_proxy:
    type: "geosite"
    target: "proxy"
    files:
      - "/etc/titandns/geosite.dat:gfw"
      - "/etc/titandns/geosite.dat:google"
      - "/etc/titandns/geosite.dat:google-gemini"
      - "/etc/titandns/geosite.dat:youtube"
      - "/etc/titandns/geosite.dat:telegram"
      - "/etc/titandns/geosite.dat:twitter"
      - "/etc/titandns/geosite.dat:facebook"
      - "/etc/titandns/geosite.dat:netflix"
      - "/etc/titandns/geosite.dat:openai"
    mark: "proxy"

  geoip_cn:
    type: "geoip"
    file: "/etc/titandns/geoip.mmdb"
    code: "cn"
    tag: "ip_cn"
    mode: "response"

  reject_nxdomain:
    type: "reject"
    rcode: "nxdomain"

  dnssec:
    type: "dnssec"
    mode: "permissive"

  ipv6_filter:
    type: "ipv6_filter"
    mode: "prefer_ipv4"
    delay_aaaa_ms: 0

# ==================== 执行流程 ====================
sequences:
  sequence_main:
    - exec: ratelimit_global
    - exec: ipv6_filter
    - matches: [{ qtype: [12, 65] }]
      exec: reject_nxdomain
    - exec: hosts_custom
    - exec: adblock_main
    - matches: [{ match_plugin: matcher_blocklist }]
      exec: reject_nxdomain
    - exec: geosite_cn
    - exec: geosite_proxy
    - exec: matcher_whitelist
    - exec: matcher_greylist
    - matches: [{ has_tag: "cn" }]
      exec: sequence_local
    - matches: [{ has_tag: "direct" }]
      exec: sequence_local
    - matches: [{ has_tag: "proxy" }]
      exec: sequence_proxy
    - exec: ecs_cn
    - exec: dga_filter
    - exec: smart_splitter
    - exec: dnssec

  sequence_requery:
    - exec: ipv6_filter
    - matches: [{ qtype: [12, 65] }]
      exec: reject_nxdomain
    - exec: adblock_main
    - matches: [{ match_plugin: matcher_blocklist }]
      exec: reject_nxdomain
    - exec: hosts_custom
    - exec: geosite_cn
    - exec: geosite_proxy
    - exec: matcher_whitelist
    - exec: matcher_greylist
    - matches: [{ has_tag: "cn" }]
      exec: upstream_local
    - matches: [{ has_tag: "direct" }]
      exec: upstream_local
    - matches: [{ has_tag: "proxy" }]
      exec: upstream_fakeip
    - exec: ecs_cn
    - exec: dga_filter
    - exec: smart_splitter
    - exec: dnssec

  sequence_node:
    - exec: cache_proxy
    - exec: upstream_fakeip

  sequence_local:
    - exec: cache_domestic
    - exec: upstream_local
    # 如启用 AliAPI，改为: - exec: fallback_local

  sequence_proxy:
    - exec: cache_proxy
    - exec: upstream_fakeip

  sequence_doq:
    - exec: upstream_doq
    - exec: dnssec

# ==================== 服务监听 ====================
servers:
  # 主 DNS (53)
  - protocol: udp
    addr: "0.0.0.0:53"
    entry: sequence_main
    socket_opts:
      so_reuseport: true
      batch_io: true
      so_rcvbuf: 16777216
      so_sndbuf: 16777216
      workers: 0

  - protocol: tcp
    addr: "0.0.0.0:53"
    entry: sequence_main
    socket_opts:
      so_reuseport: true
      tcp_read_timeout_ms: 5000

  # 调试端口 (6667)
  - protocol: udp
    addr: "0.0.0.0:6667"
    entry: sequence_requery
    socket_opts:
      so_reuseport: true
      workers: 0

  - protocol: tcp
    addr: "0.0.0.0:6667"
    entry: sequence_requery
    socket_opts:
      so_reuseport: true
      tcp_read_timeout_ms: 5000

  # 节点专用 (7777)
  - protocol: udp
    addr: "0.0.0.0:7777"
    entry: sequence_node
    socket_opts:
      so_reuseport: true
      so_rcvbuf: 8388608
      so_sndbuf: 8388608
      workers: 0

  - protocol: tcp
    addr: "0.0.0.0:7777"
    entry: sequence_node
    socket_opts:
      so_reuseport: true
      tcp_read_timeout_ms: 5000

  # 国内直连 (8888)
  - protocol: udp
    addr: "0.0.0.0:8888"
    entry: sequence_local
    socket_opts:
      so_reuseport: true
      so_rcvbuf: 8388608
      so_sndbuf: 8388608
      workers: 0

  - protocol: tcp
    addr: "0.0.0.0:8888"
    entry: sequence_local
    socket_opts:
      so_reuseport: true
      tcp_read_timeout_ms: 5000

  # DoQ 测试 (8530)
  - protocol: udp
    addr: "0.0.0.0:8530"
    entry: sequence_doq
    socket_opts:
      so_reuseport: true
      workers: 0

  - protocol: tcp
    addr: "0.0.0.0:8530"
    entry: sequence_doq
    socket_opts:
      so_reuseport: true
      tcp_read_timeout_ms: 5000
