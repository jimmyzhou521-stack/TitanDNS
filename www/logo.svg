<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="titanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#00bcd4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield -->
    <path d="M45 5 L85 20 L85 55 C85 75 65 90 45 95 C25 90 5 75 5 55 L5 20 Z" 
          fill="url(#titanGrad)" stroke="#0d47a1" stroke-width="2"/>
    <!-- Inner Network Pattern -->
    <circle cx="45" cy="45" r="20" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
    <circle cx="45" cy="45" r="12" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="45" cy="45" r="5" fill="#00e5ff"/>
    <!-- Network Nodes -->
    <circle cx="45" cy="25" r="4" fill="#00e5ff"/>
    <circle cx="65" cy="45" r="4" fill="#00e5ff"/>
    <circle cx="45" cy="65" r="4" fill="#00e5ff"/>
    <circle cx="25" cy="45" r="4" fill="#00e5ff"/>
    <!-- Connection Lines -->
    <line x1="45" y1="29" x2="45" y2="40" stroke="#00e5ff" stroke-width="2"/>
    <line x1="61" y1="45" x2="50" y2="45" stroke="#00e5ff" stroke-width="2"/>
    <line x1="45" y1="50" x2="45" y2="61" stroke="#00e5ff" stroke-width="2"/>
    <line x1="29" y1="45" x2="40" y2="45" stroke="#00e5ff" stroke-width="2"/>
  </g>
  
  <!-- TitanDNS Text -->
  <text x="110" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="url(#titanGrad)">
    Titan<tspan fill="#00bcd4">DNS</tspan>
  </text>
  
  <!-- Chinese Subtitle -->
  <text x="110" y="85" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" fill="#546e7a">
    泰坦DNS · 高性能智能分流
  </text>
  
  <!-- Version Badge -->
  <rect x="315" y="35" width="55" height="22" rx="4" fill="#e3f2fd"/>
  <text x="342" y="51" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1565c0" text-anchor="middle">
    v1.0.2
  </text>
</svg>
